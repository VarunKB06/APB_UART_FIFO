name: APB UART FIFO RTL Verification

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  rtl-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Icarus Verilog
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog

      - name: Run all verification stages
        run: bash verification/scripts/run_all.sh

      - name: Upload simulation logs and waveforms
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apb-uart-simulation-results
          path: |
            results/
            waveforms/
          if-no-files-found: warn
          retention-days: 30
